site_name: 海光 DCU 微架构与算子优化指南
site_description: 从软件执行模型、CU/Wave64/LDS/MMAC 微架构到 HIP、Triton、lightop 与 hipprof 硬件 PMC 计数器实测的实战手册
site_url: https://mantuoluozk.github.io/dcu-microarch-guide/
repo_url: https://github.com/mantuoluozk/dcu-microarch-guide
repo_name: mantuoluozk/dcu-microarch-guide

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.expand
    - navigation.footer
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 首页: index.md
  - 专题实施方案: 00-plan/research-plan.md
  - 第一部分：DCU 微架构原理:
      - 1.1 整体架构、执行模型与软件栈链路: 01-overview/software-stack.md
      - 1.2 线程映射、SIMT 分支与计算单元（含 MMAC）: 02-compute/cu-and-simt.md
      - 1.3 存储体系、合并访存与异步等待: 03-memory/memory-hierarchy.md
      - 1.4 Kernel 生命周期、Occupancy 与 Roofline 模型: 04-scheduling/occupancy-and-roofline.md
      - 1.5 微架构自动化分析与建模（待补充）: 05-modeling/auto-analysis.md
  - 第二部分：Profiling 与性能分析工具链:
      - 2.1 工具链全景与软件栈探测: profiling/01-toolchain-overview.md
      - 2.2 硬件 PMC 采集与自研解析工具: profiling/02-hipprof-and-parser.md
      - 2.3 ISA 反汇编分析与仿真（DCUSIM 待补充）: profiling/03-isa-and-sim.md
  - 第三部分：底层微基准与算子实战:
      - 实验导览与环境准备: labs/lab-setup.md
      - HIP 底层微基准:
          - 实验 1：合并访存与 float4 向量化: labs/lab01-memory-coalescing.md
          - 实验 2：LDS Bank Conflict 与 Swizzle: labs/lab02-lds-bank-conflict.md
          - 实验 3：SIMT 分支发散与 If-Conversion: labs/lab03-branch-divergence.md
          - 实验 4：Occupancy 悬崖与 ILP 延迟隐藏: labs/lab04-occupancy-ilp.md
          - 实验 5：Wave Shuffle 规约 vs LDS 规约: labs/lab05-wave-shuffle-reduction.md
          - 实验 6：存储延迟阶梯（L1 / L2 / HBM）: labs/lab08-memory-latency-ladder.md
          - 实验 7：HCU Builtin MMAC 与 VALU 峰值: labs/lab09-mmac-builtin-and-valu.md
      - Triton / lightop 高级算子:
          - 实验 8：融合 RMSNorm 与 ISA 剖析: labs/lab06-triton-lightop-rmsnorm.md
          - 实验 9：Triton GEMM vs rocBLAS 与 PMC 破案: labs/lab07-triton-gemm-vs-rocblas.md
          - 实验 10：Triton GEMM 调优实战（待补充）: labs/lab10-triton-gemm-tuning.md
  - 第四部分：大模型推理优化实战:
      - 4.1 vLLM / SGLang 推理热点分析（待补充）: llm-opt/01-framework-profiling.md
      - 4.2 GEMM 与 MoE 算子优化（待补充）: llm-opt/02-gemm-and-moe.md
      - 4.3 Attention 与 KV Cache 优化（待补充）: llm-opt/03-attention-kvcache.md
      - 4.4 案例参考：LSTM Persistent MMAC Kernel: cases/lstm-persistent-kernel.md
      - 4.5 通用算子优化六步法与研发反馈清单: cases/llm-operators-playbook.md
  - 实验路线图与更新日志: roadmap.md
