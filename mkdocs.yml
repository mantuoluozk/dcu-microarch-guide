site_name: 海光 DCU 微架构与算子优化指南
site_description: 从软件执行模型、CU/Wave64/LDS/MMAC 微架构到 HIP、Triton、lightop 与 hipprof 硬件 PMC 计数器实测的实战手册
site_url: https://mantuoluozk.github.io/dcu-microarch-guide/
repo_url: https://github.com/mantuoluozk/dcu-microarch-guide
repo_name: mantuoluozk/dcu-microarch-guide

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.footer
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 首页: index.md
  - 一、微架构原理:
      - 1.1 整体架构与软件栈链路: 01-overview/software-stack.md
      - 1.2 线程映射、SIMT 与计算单元: 02-compute/cu-and-simt.md
      - 1.3 存储体系、合并访存与异步等待: 03-memory/memory-hierarchy.md
      - 1.4 Kernel 生命周期与 Roofline: 04-scheduling/occupancy-and-roofline.md
  - 二、BW100 实战实验:
      - 实验环境与 hipprof 工具链: labs/lab-setup.md
      - HIP 底层微基准:
          - 实验 1：合并访存与 float4: labs/lab01-memory-coalescing.md
          - 实验 2：LDS Bank Conflict: labs/lab02-lds-bank-conflict.md
          - 实验 3：SIMT 分支发散: labs/lab03-branch-divergence.md
          - 实验 4：Occupancy 与 Shuffle: labs/lab04-occupancy-and-shuffle.md
      - Triton / lightop 高级算子:
          - 实验 5：融合 RMSNorm 与 ISA: labs/lab05-triton-lightop-rmsnorm.md
          - 实验 6：Triton GEMM 与 PMC 破案: labs/lab06-triton-gemm-vs-rocblas.md
  - 三、算子案例与方法论:
      - 案例 1：LSTM Persistent MMAC: cases/lstm-persistent-kernel.md
      - 案例 2：大模型算子优化清单: cases/llm-operators-playbook.md
  - 四、实验路线图: roadmap.md
