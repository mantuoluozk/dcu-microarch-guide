site_name: 海光 DCU 微架构与算子优化指南
site_description: 从软件执行模型、CU/Wave64/LDS/MMAC 微架构到 HIP、Triton、lightop 与 hipprof 硬件 PMC 计数器实测的实战手册
site_url: https://mantuoluozk.github.io/dcu-microarch-guide/
repo_url: https://github.com/mantuoluozk/dcu-microarch-guide
repo_name: mantuoluozk/dcu-microarch-guide

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 首页: index.md
  - 微架构原理:
      - 第 1 章：整体架构与软件栈链路: 01-overview/software-stack.md
      - 第 2 章：线程映射、SIMT 分支与计算单元: 02-compute/cu-and-simt.md
      - 第 3 章：存储体系、合并访存与异步等待: 03-memory/memory-hierarchy.md
      - 第 4 章：Kernel 生命周期、Occupancy 与 Roofline: 04-scheduling/occupancy-and-roofline.md
  - BW100 实战实验:
      - 实验导览：环境、ISA 与 hipprof 工具链: labs/lab-setup.md
      - 实验 1：全局内存合并访存与 float4 向量化: labs/lab01-memory-coalescing.md
      - 实验 2：LDS Bank Conflict 与 Swizzle 消除: labs/lab02-lds-bank-conflict.md
      - 实验 3：SIMT 分支发散与 If-Conversion: labs/lab03-branch-divergence.md
      - 实验 4：Occupancy 悬崖、ILP 与 Shuffle 规约: labs/lab04-occupancy-and-shuffle.md
      - 实验 5：Triton vs lightop 融合 RMSNorm: labs/lab05-triton-lightop-rmsnorm.md
      - 实验 6：Triton GEMM vs rocBLAS 与 PMC 破案: labs/lab06-triton-gemm-vs-rocblas.md
  - 算子案例与方法论:
      - 案例 1：LSTM Persistent MMAC Kernel 拆解: cases/lstm-persistent-kernel.md
      - 案例 2：大模型算子迁移与优化清单: cases/llm-operators-playbook.md
  - 实验路线图: roadmap.md
